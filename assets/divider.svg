<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="24" viewBox="0 0 1100 24" role="presentation">
  <defs>
    <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1116" stop-opacity="0"/>
      <stop offset="18%" stop-color="#38D9F0" stop-opacity="0.9"/>
      <stop offset="38%" stop-color="#00df8f" stop-opacity="1"/>
      <stop offset="62%" stop-color="#8C65F7" stop-opacity="1"/>
      <stop offset="82%" stop-color="#eb705f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1116" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dGlow2" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- base line -->
  <rect x="0" y="11" width="1100" height="2" rx="1" fill="url(#dGrad)" opacity="0.9"/>

  <!-- traveling light pulse -->
  <rect y="9" width="200" height="6" rx="3" fill="url(#sparkGrad)" filter="url(#dGlow)" opacity="0.95">
    <animate attributeName="x" values="-200;1100" dur="3.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>

  <!-- second slower pulse -->
  <rect y="10" width="120" height="4" rx="2" fill="#00df8f" opacity="0.5" filter="url(#dGlow2)">
    <animate attributeName="x" values="1100;-120" dur="5.2s" repeatCount="indefinite"/>
  </rect>

  <!-- center diamond with glow -->
  <g transform="translate(550 12)">
    <rect x="-7" y="-7" width="14" height="14" rx="2" transform="rotate(45)" fill="#0d1116" stroke="#00df8f" stroke-width="1.2" filter="url(#dGlow2)">
      <animateTransform attributeName="transform" type="rotate" values="45;225;405;45" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-3" y="-3" width="6" height="6" rx="1" transform="rotate(45)" fill="#00df8f" filter="url(#dGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="45;405" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- tiny side dots -->
  <circle cx="260" cy="12" r="2" fill="#38D9F0" opacity="0.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="840" cy="12" r="2" fill="#8C65F7" opacity="0.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
</svg>
